<style>
  :root {
    --bg: #fbfbf9;
    --fg: #1c1c1a;
    --muted: #76766f;
    --line: #e4e3dd;
    --panel: #f2f1ec;
    --accent: #c2410c;
    --todo-bg: #fff3c4;
    --todo-fg: #6b4e00;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --fg: #e8e7e2; --muted: #92918a; --line: #2c2c29;
      --panel: #1d1d1b; --accent: #f97316; --todo-bg: #3a3000; --todo-fg: #ffd966;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --fg: #e8e7e2; --muted: #92918a; --line: #2c2c29;
    --panel: #1d1d1b; --accent: #f97316; --todo-bg: #3a3000; --todo-fg: #ffd966;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 740px; margin: 0 auto; padding: 0 16px; }

  /* file header, like a code host's file view */
  .filebar {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .filebar .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; height: 52px; font: 13px var(--mono);
  }
  .path { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .path a { color: var(--muted); text-decoration: none; }
  .path a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .path b { color: var(--fg); font-weight: 600; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .btn {
    font: 12px var(--mono); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"] { background: var(--panel); border-color: var(--muted); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang a { font: 12px var(--mono); padding: 5px 8px; color: var(--muted); text-decoration: none; }
  .lang a[aria-current="true"] { background: var(--panel); color: var(--fg); font-weight: 600; }
  .lang a:hover { color: var(--fg); }
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  .theme-btn { display: grid; place-items: center; width: 28px; height: 27px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .theme-btn:hover { color: var(--fg); border-color: var(--muted); }
  .theme-btn svg { width: 14px; height: 14px; }

  main { padding: 40px 0 80px; }

    font: 13.5px/1.7 var(--mono); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 18px; margin: 0 0 40px; overflow-wrap: break-word;
  }

  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.02em; }
  .contact-card { display: flex; align-items: center; gap: 16px; margin-top: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
  .contact-card strong { display: block; margin-bottom: 2px; }
  .contact-card ul { list-style: none; padding: 0; }
  .contact-card li { margin: 2px 0; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  h2 { font-size: 19px; margin: 48px 0 14px; letter-spacing: -0.01em; }
  h2::before { content: "## "; color: var(--muted); font-family: var(--mono); font-weight: 400; }
  h1::before { content: "# "; color: var(--muted); font-family: var(--mono); font-weight: 400; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 0 0 12px; }
  .lede { font-size: 18px; color: var(--fg); }

  ul { padding-left: 20px; margin: 0; }
  li { margin: 4px 0; }
  li::marker { color: var(--muted); }

  dl.caps { display: grid; grid-template-columns: 110px 1fr; gap: 6px 16px; margin: 0; }
  dl.caps dt { font: 13px/1.9 var(--mono); color: var(--muted); }
  dl.caps dd { margin: 0; }

  .example {
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 0 0 10px;
  }
  .example p { margin: 0; }
  .example .io { font: 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
  .example p + p { margin-top: 6px; }

  .version { border-left: 2px solid var(--line); padding: 0 0 22px 18px; position: relative; }
  .version::before {
    content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--muted);
  }
  .version:first-child::before { border-color: var(--accent); background: var(--accent); }
  .version:last-child { padding-bottom: 0; }
  .version h3 { font-family: var(--mono); font-size: 14.5px; }
  .version .tag { color: var(--accent); }
  .version .when { color: var(--muted); font-weight: 400; }
  .version ul { list-style: none; padding: 0; }
  .version li .kind { font: 12px var(--mono); color: var(--muted); display: inline-block; min-width: 80px; }

  /* skill listing on the index page */
  .skills { display: grid; gap: 12px; margin-top: 28px; }
  .skill {
    display: block; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    color: var(--fg); text-decoration: none; transition: border-color .15s;
  }
  .skill:hover { border-color: var(--accent); }
  .skill-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .skill-name { font-size: 17px; font-weight: 650; }
  .skill-file { display: block; margin-top: 2px; font: 12px var(--mono); color: var(--muted); font-weight: 400; }
  .skill-open { font: 12px var(--mono); color: var(--accent); white-space: nowrap; }
  .skill-desc { color: var(--muted); font-size: 15px; margin: 0; }

  .contacts { margin-top: 24px; font: 13px var(--mono); color: var(--muted); }
  .contacts a { color: var(--muted); }
  .back { display: inline-block; font: 13px var(--mono); color: var(--muted); text-decoration: none; margin-bottom: 20px; }
  .back:hover { color: var(--fg); }

  a { color: var(--fg); text-decoration-color: var(--muted); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }

  .todo { background: var(--todo-bg); color: var(--todo-fg); border-radius: 3px; padding: 0 4px; font-size: .95em; }

  pre.raw {
    font: 13px/1.65 var(--mono); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 18px; white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  [hidden] { display: none !important; }

  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font: 12.5px/1.7 var(--mono); }

  @media (max-width: 560px) {
    h1 { font-size: 28px; }
    dl.caps { grid-template-columns: 1fr; gap: 0; }
    dl.caps dd { margin-bottom: 10px; }
    .path .host { display: none; }
    .path .crumb { display: none; }
    .actions { gap: 4px; }
    .btn { padding: 5px 7px; }
  }
</style>
</head>
<body>

<header class="filebar">
  <div class="wrap">
    <div class="path">{{PATH}}</div>
    <div class="actions">
      <button class="btn" id="viewRendered" aria-pressed="true">{{T_PREVIEW}}</button>
      <button class="btn" id="viewRaw" aria-pressed="false" data-raw="{{RAW_URL}}">Raw</button>
      {{CV_BUTTON}}
      <nav class="lang" aria-label="Language">{{SWITCH}}</nav>
      <button class="theme-btn" id="themeToggle" type="button"></button>
    </div>
  </div>
</header>

<main class="wrap">

  <pre class="raw" id="raw" hidden></pre>

  <article id="rendered">
{{BODY}}
  </article>
</main>

<footer>
  <div class="wrap">{{FOOTER}}</div>
</footer>

<script>
  const rendered = document.getElementById('rendered');
  const raw = document.getElementById('raw');
  const bR = document.getElementById('viewRendered');
  const bW = document.getElementById('viewRaw');
  let loaded = false;

  function show(isRaw) {
    rendered.hidden = isRaw;
    raw.hidden = !isRaw;
    bR.setAttribute('aria-pressed', String(!isRaw));
    bW.setAttribute('aria-pressed', String(isRaw));
  }

  bR.addEventListener('click', () => show(false));
  bW.addEventListener('click', async () => {
    const url = bW.dataset.raw;
    if (!loaded) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        raw.textContent = await res.text();
        loaded = true;
      } catch (e) {
        location.href = url;
        return;
      }
    }
    show(true);
  });

  // Appearance: system → light → dark → system. The choice is remembered.
  const themeBtn = document.getElementById('themeToggle');
  const icons = {
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  };
  const themeNames = document.documentElement.lang === 'cs'
    ? { auto: 'Vzhled podle systému', light: 'Světlý vzhled', dark: 'Tmavý vzhled', next: 'Kliknutím přepnete na' }
    : { auto: 'System appearance', light: 'Light appearance', dark: 'Dark appearance', next: 'Click to switch to' };
  const nextTheme = { auto: 'light', light: 'dark', dark: 'auto' };
  function renderTheme() {
    const current = document.documentElement.dataset.theme || 'auto';
    const label = `${themeNames[current]}. ${themeNames.next}: ${themeNames[nextTheme[current]].toLowerCase()}.`;
    themeBtn.innerHTML = icons[current];
    themeBtn.title = label;
    themeBtn.setAttribute('aria-label', label);
  }
  themeBtn.addEventListener('click', () => {
    const value = nextTheme[document.documentElement.dataset.theme || 'auto'];
    if (value === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = value;
    try {
      if (value === 'auto') localStorage.removeItem('theme');
      else localStorage.setItem('theme', value);
    } catch (e) {}
    renderTheme();
  });
  renderTheme();

  // Remember an explicit language choice so the root page stops auto-redirecting.
  document.querySelectorAll('.lang a').forEach((a) => a.addEventListener('click', () => {
    try { localStorage.setItem('lang', a.dataset.lang); } catch (e) {}
  }));
</script>
</body>
</html>
